name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 如果项目有构建步骤（如 npm run build），在这里加上
      # 如果是纯静态文件，跳过构建，直接上传仓库目录或指定子目录

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 根据你的项目结构调整：
          # 纯静态站点在根目录 → path: .
          # 有构建产物 → path: ./dist
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
